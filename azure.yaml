# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: aisearch-openai-rag-audio
metadata:
  template: aisearch-openai-rag-audio@0.0.3-beta
services:
  backend:
    project: ./app/backend
    language: py
    host: appservice
    hooks:
      predeploy:
        windows:
          shell: pwsh
          run: ../../scripts/build_frontend.ps1
          interactive: true
          continueOnError: false
        posix:
          shell: sh
          run: ../../scripts/build_frontend.sh
          interactive: true
          continueOnError: false
hooks:
    postprovision:
      windows:
        shell: pwsh
        run: ./scripts/write_env.ps1
        interactive: true
        continueOnError: false
      posix:
        shell: sh
        run: ./scripts/write_env.sh
        interactive: true
        continueOnError: false
